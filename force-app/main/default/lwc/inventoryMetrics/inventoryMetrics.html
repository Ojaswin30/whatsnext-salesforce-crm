<template>
    <lightning-card title="Inventory Monitoring" icon-name="standard:product_item">
        <div slot="actions">
            <lightning-button-group>
                <lightning-button 
                    label="All" 
                    variant={allButtonVariant} 
                    onclick={handleFilterAll} 
                    size="small">
                </lightning-button>
                <lightning-button 
                    label="SUV" 
                    variant={suvButtonVariant} 
                    onclick={handleFilterSuv} 
                    size="small">
                </lightning-button>
                <lightning-button 
                    label="EV" 
                    variant={evButtonVariant} 
                    onclick={handleFilterEv} 
                    size="small">
                </lightning-button>
                <lightning-button 
                    label="Sedan" 
                    variant={sedanButtonVariant} 
                    onclick={handleFilterSedan} 
                    size="small">
                </lightning-button>
            </lightning-button-group>
        </div>

        <div class="slds-p-around_medium">
            <!-- Loading Spinner -->
            <template lwc:if={isLoading}>
                <div class="slds-is-relative slds-p-vertical_large">
                    <lightning-spinner alternative-text="Loading inventory..." size="small"></lightning-spinner>
                </div>
            </template>

            <!-- Vehicle Inventory List -->
            <template lwc:if={hasItems}>
                <div class="inventory-list">
                    <template for:each={filteredInventory} for:item="item">
                        <div key={item.vehicleId} class="inventory-item slds-p-vertical_small slds-border_bottom">
                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_xx-small">
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <span class="vehicle-title slds-text-heading_small slds-m-right_small">{item.vehicleName}</span>
                                    <span class="slds-badge slds-badge_lightest slds-m-right_x-small">{item.model}</span>
                                    <span class="slds-text-body_small slds-text-color_weak slds-m-left_xx-small">({item.dealerName})</span>
                                </div>
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <span class="unit-count slds-text-heading_small slds-text-color_default slds-m-right_small font-bold">
                                        {item.stockQuantity} {item.unitLabel}
                                    </span>
                                    <span class={item.badgeClass}>{item.status}</span>
                                </div>
                            </div>

                            <!-- Visual Stock Level Bar -->
                            <div class="slds-m-top_xx-small">
                                <lightning-progress-bar 
                                    value={item.percentage} 
                                    variant={item.progressVariant} 
                                    size="medium">
                                </lightning-progress-bar>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Empty State -->
            <template lwc:if={showEmptyState}>
                <div class="slds-text-align_center slds-p-vertical_large">
                    <lightning-icon icon-name="utility:info_alt" size="medium" alternative-text="No Inventory"></lightning-icon>
                    <p class="slds-text-heading_small slds-m-top_small">No vehicle inventory records found.</p>
                    <p class="slds-text-color_weak">Add vehicles to your dealership to start tracking stock levels.</p>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
