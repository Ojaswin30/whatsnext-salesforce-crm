<template>
    <lightning-card title="Low Stock & Inventory Alerts" icon-name="standard:service_crew_member">
        <div slot="actions">
            <template lwc:if={hasAlerts}>
                <span class="slds-badge slds-theme_error">{alertCount} Urgent</span>
            </template>
            <template lwc:else>
                <span class="slds-badge slds-theme_success">Inventory Healthy</span>
            </template>
        </div>

        <div class="slds-p-around_medium">
            <!-- Loading Spinner -->
            <template lwc:if={isLoading}>
                <div class="slds-is-relative slds-p-vertical_large">
                    <lightning-spinner alternative-text="Checking inventory alerts..." size="small"></lightning-spinner>
                </div>
            </template>

            <!-- Alerts List -->
            <template lwc:if={hasAlerts}>
                <div class="alerts-container">
                    <template for:each={alertItems} for:item="alert">
                        <div key={alert.vehicleId} class={alert.containerClass}>
                            <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <lightning-icon 
                                        icon-name={alert.iconName} 
                                        size="small" 
                                        variant={alert.iconVariant} 
                                        class="slds-m-right_small">
                                    </lightning-icon>
                                    <div>
                                        <div class="slds-grid slds-grid_vertical-align-center">
                                            <span class="vehicle-alert-title slds-text-title_bold slds-m-right_x-small">
                                                {alert.vehicleName}
                                            </span>
                                            <span class="slds-badge slds-badge_lightest slds-m-right_x-small">{alert.model}</span>
                                            <span class={alert.badgeClass}>{alert.severityLabel}</span>
                                        </div>
                                        <div class="slds-text-body_small slds-text-color_weak slds-m-top_xxx-small">
                                            {alert.alertMessage} &bull; <span class="font-semibold">{alert.dealerName}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="slds-text-align_right">
                                    <div class="stock-pill slds-text-title_bold font-bold">
                                        {alert.stockQuantity} Left
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Healthy Inventory State (No Alerts) -->
            <template lwc:if={showHealthyState}>
                <div class="slds-text-align_center slds-p-vertical_large">
                    <lightning-icon icon-name="action:approval" size="medium" alternative-text="All Stock Healthy"></lightning-icon>
                    <p class="slds-text-heading_small slds-m-top_small font-semibold text-healthy">
                        All Vehicle Stock Levels Healthy
                    </p>
                    <p class="slds-text-color_weak">
                        No vehicle models are currently below the reorder threshold (3 units).
                    </p>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
