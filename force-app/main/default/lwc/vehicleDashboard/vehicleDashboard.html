<template>
    <div class="dashboard-wrapper">
        <!-- Dashboard Header (Compact) -->
        <div class="slds-page-header slds-page-header_record-home header-container slds-m-bottom_x-small">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure slds-m-right_x-small">
                            <lightning-icon 
                                icon-name="standard:dashboard" 
                                alternative-text="Dashboard" 
                                size="small">
                            </lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <h1 class="main-title font-bold slds-m-right_small" title="WhatsNext Vision Motors">
                                    WhatsNext Vision Motors
                                </h1>
                                <span class="sub-title slds-text-color_weak">
                                    Dealership operations dashboard — proposed design
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__col-actions">
                    <lightning-button 
                        label="Refresh Metrics" 
                        icon-name="utility:refresh" 
                        variant="neutral" 
                        size="small"
                        onclick={handleRefresh}
                        disabled={isLoading}>
                    </lightning-button>
                </div>
            </div>
        </div>

        <!-- Global Spinner -->
        <template lwc:if={isLoading}>
            <div class="slds-is-relative spinner-box">
                <lightning-spinner alternative-text="Loading operations data..." size="small"></lightning-spinner>
            </div>
        </template>

        <!-- Metric Summary Cards (Compact 4-Card Grid) -->
        <div class="slds-grid slds-wrap slds-gutters_x-small slds-m-bottom_x-small">
            <!-- 1. Total Vehicles -->
            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_xx-small">
                <div class="metric-card card-accent-blue slds-p-horizontal_small slds-p-vertical_x-small">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <div>
                            <div class="metric-number font-bold text-navy">{totalVehicles}</div>
                            <div class="metric-heading font-semibold">Total Vehicles</div>
                            <div class="metric-caption slds-text-color_weak">Across all dealerships</div>
                        </div>
                        <div class="metric-icon-box bg-blue-subtle">
                            <lightning-icon icon-name="custom:custom31" size="small" alternative-text="Vehicles"></lightning-icon>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. Available Units -->
            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_xx-small">
                <div class="metric-card card-accent-green slds-p-horizontal_small slds-p-vertical_x-small">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <div>
                            <div class="metric-number font-bold text-success">{availableUnits}</div>
                            <div class="metric-heading font-semibold">Available Units</div>
                            <div class="metric-caption slds-text-color_weak">Illustrative inventory metric</div>
                        </div>
                        <div class="metric-icon-box bg-green-subtle">
                            <lightning-icon icon-name="standard:product_item" size="small" alternative-text="Inventory"></lightning-icon>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. Pending Orders -->
            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_xx-small">
                <div class="metric-card card-accent-amber slds-p-horizontal_small slds-p-vertical_x-small">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <div>
                            <div class="metric-number font-bold text-amber">{pendingOrders}</div>
                            <div class="metric-heading font-semibold">Pending Orders</div>
                            <div class="metric-caption slds-text-color_weak">Awaiting confirmation</div>
                        </div>
                        <div class="metric-icon-box bg-amber-subtle">
                            <lightning-icon icon-name="standard:orders" size="small" alternative-text="Orders"></lightning-icon>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 4. Customers -->
            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_xx-small">
                <div class="metric-card card-accent-purple slds-p-horizontal_small slds-p-vertical_x-small">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <div>
                            <div class="metric-number font-bold text-purple">{totalCustomers}</div>
                            <div class="metric-heading font-semibold">Customers</div>
                            <div class="metric-caption slds-text-color_weak">Registered customers</div>
                        </div>
                        <div class="metric-icon-box bg-purple-subtle">
                            <lightning-icon icon-name="standard:contact" size="small" alternative-text="Customers"></lightning-icon>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dashboard Body: Two-Column Responsive Layout (Compact Spacing) -->
        <div class="slds-grid slds-wrap slds-gutters_x-small">
            <!-- Left Column: Inventory Metrics & Low Stock Alerts -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_7-of-12">
                <div class="slds-m-bottom_x-small">
                    <c-inventory-metrics inventory-data={inventoryList}></c-inventory-metrics>
                </div>
                <div class="slds-m-bottom_x-small">
                    <c-low-stock-alerts alerts={alertsList}></c-low-stock-alerts>
                </div>
            </div>

            <!-- Right Column: Order Analytics & Dealer Performance -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_5-of-12">
                <div class="slds-m-bottom_x-small">
                    <c-order-analytics analytics-data={orderAnalyticsData}></c-order-analytics>
                </div>
                <div class="slds-m-bottom_x-small">
                    <c-dealer-performance dealers-data={dealersList}></c-dealer-performance>
                </div>
            </div>
        </div>
    </div>
</template>
